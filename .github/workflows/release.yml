name: Release

# Cut a release by pushing a tag `vX.Y.Z` (see docs/RELEASING.md). Running the workflow by hand
# (workflow_dispatch) is a dry run unless `dry_run` is unticked AND the selected ref is a tag.
# A dry run builds, validates and tests everything, and uploads the artifacts, but never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only; never publish (publishing also requires running from a v* tag)"
        type: boolean
        default: true

# Least privilege: every job gets read-only access unless it overrides this below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check tag, Python version, npm version and CHANGELOG agree
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Branch dry runs do not need a promoted CHANGELOG section; tag runs always do.
          tag_args=(--no-changelog-check)
          publish=false
          if [ "$REF_TYPE" = "tag" ]; then
            tag_args=(--tag "$REF_NAME")  # replaces the lenient default
            # Tags only publish when they point at a commit that is on main.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME is not on main; refusing to release"
              exit 1
            fi
            if [ "$EVENT" = "push" ] || [ "$DRY_RUN" = "false" ]; then
              publish=true
            fi
          fi
          version=$(python .github/scripts/release_checks.py versions "${tag_args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (publish=$publish)" >> "$GITHUB_STEP_SUMMARY"

  test-python:
    name: Python tests (${{ matrix.python-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - name: Install React package (needed by schema-converter TypeScript tests)
        working-directory: packages/react
        run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,django]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q --cov --cov-report=term-missing:skip-covered

  build-python:
    name: Build Python distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build sdist and wheel, then validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Smoke-test the wheel in a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls dist/*.whl)[server]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -I -c "import query_builder, query_builder.integrations.fastapi as f; assert f.FASTAPI_AVAILABLE; print(query_builder.__version__)"
          "$RUNNER_TEMP/smoke/bin/query-builder" --version
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | "$RUNNER_TEMP/smoke/bin/query-builder-mcp"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-npm:
    name: Build and test npm package
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/react/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run clean && pnpm run build
      - run: pnpm run check:package
      - run: pnpm run test:coverage
      - name: Pack the tarball that will be published
        run: |
          mkdir -p "$GITHUB_WORKSPACE/npm-dist"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-dist"
          ls -l "$GITHUB_WORKSPACE/npm-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: npm-dist/*.tgz
          if-no-files-found: error

  assets:
    name: SBOMs and checksums
    needs: [verify, build-python, build-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-dist"
          path: release
          merge-multiple: true
      - name: CycloneDX SBOMs
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install "$(ls release/*.whl)[server,django]"
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install cyclonedx-bom
          "$RUNNER_TEMP/tools/bin/cyclonedx-py" environment --of JSON \
            -o release/query-builder-engine.python.cdx.json "$RUNNER_TEMP/runtime"
          (cd packages/react && pnpm install --frozen-lockfile)
          npx --yes @cyclonedx/cdxgen@12.8.5 -t pnpm --no-install-deps \
            -o release/query-builder-react.npm.cdx.json packages/react
      - name: SHA-256 checksums
        working-directory: release
        run: |
          sha256sum -- * | grep -v 'SHA256SUMS' > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [verify, test-python, assets]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/query-builder-engine/${{ needs.verify.outputs.version }}/
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing; granted to this job only
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # PEP 740 attestations are generated and uploaded by default for trusted publishing.

  publish-npm:
    name: Publish to npm (with provenance)
    needs: [verify, build-npm, assets]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@jacob-white/query-builder-react/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # lets `npm publish --provenance` sign the provenance statement
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: npm-dist
      - name: Publish the already-built tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./npm-dist/*.tgz --provenance --access public

  github-release:
    name: GitHub release
    needs: [verify, publish-pypi, publish-npm]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets; granted to this job only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python .github/scripts/release_checks.py notes "$VERSION" > RELEASE_NOTES.md
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md
