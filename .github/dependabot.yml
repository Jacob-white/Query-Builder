version: 2

# Weekly updates scheduled for Monday morning (06:00 UTC).
# Minor and patch updates are grouped by dependency type (dev vs. production runtime),
# allowing quick review of low-risk dev tooling while keeping runtime updates clearly isolated.
# Major updates arrive individually.
# A cooldown period prevents brand-new releases from opening immediately.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      python-dev:
        dependency-type: development
        update-types: [minor, patch]
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/react
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      react-dev:
        dependency-type: development
        update-types: [minor, patch]
      react-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /examples/fullstack_starter/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      starter-frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
