version: 2

# Weekly updates, minor/patch bumps grouped into a single PR per ecosystem so reviewers
# get one reviewable change; major bumps stay as individual PRs.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /packages/react
    schedule:
      interval: weekly
    groups:
      react-package-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /examples/fullstack_starter/frontend
    schedule:
      interval: weekly
    groups:
      starter-frontend-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
