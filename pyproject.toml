[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-builder-engine"
version = "1.0.0"
description = "Universal, multi-dialect SQL query builder, declarative compiler, AST safety validator, and graph-based join path solver."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jacob White", email = "jake@hobbyhabbit.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlparse>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    "polars>=1.0.0",
]
duckdb = ["duckdb>=0.9.0"]
sqlalchemy = ["sqlalchemy>=2.0.0"]
polars = ["polars>=1.0.0"]
datafusion = ["datafusion>=38.0.0"]
databricks = ["databricks-sql-connector>=3.0.0"]
athena = ["pyathena>=3.0.0"]
spanner = ["google-cloud-spanner>=3.40.0"]
dynamodb = ["boto3>=1.34.0"]
postgres = ["psycopg[binary]>=3.1.0"]
mysql = ["mysqlclient>=2.2.0"]
mssql = ["pymssql>=2.2.0"]
snowflake = ["snowflake-connector-python>=3.0.0"]
bigquery = ["google-cloud-bigquery>=3.0.0"]
clickhouse = ["clickhouse-connect>=0.6.0"]
oracle = ["oracledb>=2.0.0"]
redshift = ["redshift-connector>=2.0.0"]
trino = ["trino>=0.320.0"]
dremio = ["pyarrow>=14.0.0"]
firebolt = ["firebolt-sdk>=1.0.0"]
tidb = ["pymysql>=1.1.0"]
singlestore = ["singlestoredb>=1.0.0"]
teradata = ["teradatasql>=20.0.0"]
couchbase = ["couchbase>=4.2.0"]
d1 = ["requests>=2.28.0"]
mongodb = ["pymongosql>=0.1.0"]
neon = ["psycopg[binary]>=3.1.0"]
supabase = ["psycopg[binary]>=3.1.0"]
prestodb = ["prestodb>=0.8.0"]
druid = ["pydruid>=0.6.5"]
pinot = ["pinotdb>=5.0.0"]
starrocks = ["pymysql>=1.1.0"]
materialize = ["psycopg[binary]>=3.1.0"]
risingwave = ["psycopg[binary]>=3.1.0"]
cratedb = ["crate>=0.30.0"]
influxdb = ["influxdb3-python>=0.5.0"]
alloydb = ["google-cloud-alloydb-connector>=1.0.0"]
vertica = ["vertica-python>=1.3.0"]
saphana = ["hdbcli>=2.18.0"]
oceanbase = ["pyoceanbase>=0.1.0"]
scylladb = ["scylla-driver>=3.25.0"]
spark = ["pyspark>=3.5.0"]
chdb = ["chdb>=2.0.0"]
greptimedb = ["greptimedb>=0.1.0"]
tdengine = ["taospy>=2.7.0"]
surrealdb = ["surrealdb>=0.3.0"]
arangodb = ["python-arango>=7.0.0"]
cassandra = ["cassandra-driver>=3.28.0"]
exasol = ["pyexasol>=0.25.0"]
db2 = ["ibm-db>=3.2.0"]
cosmosdb = ["azure-cosmos>=4.5.0"]
doris = ["pydoris>=0.2.0"]
impala = ["impyla>=0.18.0"]
hive = ["pyhive>=0.7.0"]
kyuubi = ["pyhive>=0.7.0"]
drill = ["pydrill>=0.3.0"]
yugabyte = ["psycopg[binary]>=3.1.0"]
opensearch = ["opensearch-py>=2.4.0"]
neo4j = ["neo4j>=5.15.0"]
kdb = ["pykx>=2.0.0"]
clickhouse-native = ["clickhouse-driver>=0.2.6"]
all = [
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    "polars>=1.0.0",
    "datafusion>=38.0.0",
    "databricks-sql-connector>=3.0.0",
    "pyathena>=3.0.0",
    "google-cloud-spanner>=3.40.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.1.0",
    "mysqlclient>=2.2.0",
    "pymssql>=2.2.0",
    "snowflake-connector-python>=3.0.0",
    "google-cloud-bigquery>=3.0.0",
    "clickhouse-connect>=0.6.0",
    "oracledb>=2.0.0",
    "redshift-connector>=2.0.0",
    "trino>=0.320.0",
    "pyarrow>=14.0.0",
    "firebolt-sdk>=1.0.0",
    "pymysql>=1.1.0",
    "singlestoredb>=1.0.0",
    "teradatasql>=20.0.0",
    "couchbase>=4.2.0",
    "requests>=2.28.0",
    "pymongosql>=0.1.0",
    "prestodb>=0.8.0",
    "pydruid>=0.6.5",
    "pinotdb>=5.0.0",
    "crate>=0.30.0",
    "vertica-python>=1.3.0",
]

[project.scripts]
query-builder = "query_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["query_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
