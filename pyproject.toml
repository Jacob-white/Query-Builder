[project.scripts]
query-builder = "query_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["query_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F811"]
