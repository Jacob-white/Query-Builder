[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-builder-engine"
version = "1.0.0"
description = "Universal, multi-dialect SQL query builder, declarative compiler, AST safety validator, and graph-based join path solver."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jacob White", email = "jake@hobbyhabbit.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlparse>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    "polars>=1.0.0",
]
duckdb = ["duckdb>=0.9.0"]
sqlalchemy = ["sqlalchemy>=2.0.0"]
polars = ["polars>=1.0.0"]
datafusion = ["datafusion>=38.0.0"]
databricks = ["databricks-sql-connector>=3.0.0"]
athena = ["pyathena>=3.0.0"]
spanner = ["google-cloud-spanner>=3.40.0"]
dynamodb = ["boto3>=1.34.0"]
postgres = ["psycopg[binary]>=3.1.0"]
mysql = ["mysqlclient>=2.2.0"]
mssql = ["pymssql>=2.2.0"]
snowflake = ["snowflake-connector-python>=3.0.0"]
bigquery = ["google-cloud-bigquery>=3.0.0"]
clickhouse = ["clickhouse-connect>=0.6.0"]
oracle = ["oracledb>=2.0.0"]
redshift = ["redshift-connector>=2.0.0"]
trino = ["trino>=0.320.0"]
all = [
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    "polars>=1.0.0",
    "datafusion>=38.0.0",
    "databricks-sql-connector>=3.0.0",
    "pyathena>=3.0.0",
    "google-cloud-spanner>=3.40.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.1.0",
    "mysqlclient>=2.2.0",
    "pymssql>=2.2.0",
    "snowflake-connector-python>=3.0.0",
    "google-cloud-bigquery>=3.0.0",
    "clickhouse-connect>=0.6.0",
    "oracledb>=2.0.0",
    "redshift-connector>=2.0.0",
    "trino>=0.320.0",
]

[project.scripts]
query-builder = "query_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["query_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
