[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-builder-engine"
version = "1.0.0"
description = "Universal, multi-dialect SQL query builder, declarative compiler, AST safety validator, and graph-based join path solver."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "HobbyHabbit LLC", email = "support@hobbyhabbit.com" }
]
maintainers = [
    { name = "Jacob White", email = "jake@hobbyhabbit.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlparse>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    "polars>=1.0.0",
]
